include ~/.config/omarchy/current/theme/kitty.conf

# ===================================================================
# FONT CONFIGURATION
# ===================================================================
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 9.0

# Font features for better coding experience
disable_ligatures never
font_features JetBrainsMonoNerdFontMono-Regular +calt +liga

# ===================================================================
# WINDOW CONFIGURATION
# ===================================================================
window_padding_width 0
window_padding_height 0
hide_window_decorations yes
show_window_resize_notification no
confirm_os_window_close 0
initial_window_width 140c
initial_window_height 40c

# Window layout
enabled_layouts splits,stack,tall,grid
window_border_width 0
window_margin_width 0
window_resize_step_cells 2
window_resize_step_lines 2

# ===================================================================
# REMOTE CONTROL & SINGLE INSTANCE
# ===================================================================
single_instance yes
allow_remote_control yes
listen_on unix:/tmp/kitty

# ===================================================================
# CURSOR & MOUSE
# ===================================================================
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
mouse_hide_wait 3.0
url_style curly
open_url_with default
detect_urls yes
copy_on_select clipboard

# ===================================================================
# SCROLLBACK
# ===================================================================
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0

# ===================================================================
# AUDIO
# ===================================================================
enable_audio_bell no
visual_bell_duration 0.0

# ===================================================================
# TAB BAR CONFIGURATION (Enhanced)
# ===================================================================
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_switch_strategy previous
tab_activity_symbol 🔔
tab_title_max_length 25
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{title[title.rfind('/')+1:]}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{title[title.rfind('/')+1:]}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"

# ===================================================================
# ADVANCED FEATURES
# ===================================================================
# Clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Shell integration (automatically enabled in supported shells)
shell_integration enabled

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Background opacity (uncomment to enable transparency)
# background_opacity 0.95
# background_blur 20

# ===================================================================
# KEYBINDINGS - WINDOW MANAGEMENT
# ===================================================================
# Toggle fullscreen
map f11 toggle_fullscreen
map ctrl+shift+f11 toggle_maximized

# Clipboard
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# New window/tab in current directory
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t new_tab_with_cwd

# Window splits
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current

# Window navigation
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down

# Window resizing
map ctrl+shift+home resize_window narrower
map ctrl+shift+end resize_window wider
map ctrl+shift+pageup resize_window taller
map ctrl+shift+pagedown resize_window shorter

# Move window
map ctrl+shift+k move_window up
map ctrl+shift+j move_window down
map ctrl+shift+h move_window left
map ctrl+shift+l move_window right

# Layout management
map ctrl+shift+z toggle_layout stack
map ctrl+shift+l next_layout

# ===================================================================
# KEYBINDINGS - TAB MANAGEMENT
# ===================================================================
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+q close_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
map ctrl+shift+alt+t set_tab_title

# Quick tab switching (Alt+number)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ===================================================================
# KEYBINDINGS - SCROLLBACK
# ===================================================================
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
map ctrl+shift+h show_scrollback

# ===================================================================
# KEYBINDINGS - FONT SIZE
# ===================================================================
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# ===================================================================
# KEYBINDINGS - MISCELLANEOUS
# ===================================================================
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
map ctrl+shift+escape kitty_shell window
map ctrl+shift+u kitten unicode_input
map ctrl+shift+f2 edit_config_file

# ===================================================================
# KITTENS (PLUGINS)
# ===================================================================
# Hints kitten - keyboard-driven link/path selection
map ctrl+shift+e kitten hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+p>h kitten hints --type hash --program -

# Diff kitten - better file comparison
map ctrl+shift+f12 launch --type=overlay --stdin-source=@screen_scrollback less +G -R

# ===================================================================
# PERFORMANCE & COMPATIBILITY
# ===================================================================
wayland_titlebar_color system
linux_display_server auto
