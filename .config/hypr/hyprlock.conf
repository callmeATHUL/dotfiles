source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
}

animations {                  # ← turn this on for polish
    enabled = true
    animation = fadeIn, 0.3, 4, linear
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center
    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4
    font_family = JetBrainsMono Nerd Font
    font_color = $font_color
    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 0                     # change to 20 if you want rounded
    shadow_passes = 0
    fade_on_empty = false
}

# ── NEW: Big clock (top center) ─────────────────────────────────────
label {
    monitor =
    text = $TIME                        # uses hyprlock's built-in time variable
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, 280
    halign = center
    valign = center
}

# ── NEW: Date below clock ───────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"   # updates every minute
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, 140
    halign = center
    valign = center
}

# ── NEW: Username greeting ──────────────────────────────────────────
label {
    monitor =
    text = Hi, $USER
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, -180
    halign = center
    valign = center
}

# ── NEW: Profile picture (circle avatar above input) ────────────────
image {
    monitor =
    path = ~/.face                      # or ~/.config/omarchy/current/avatar.png
    size = 140
    rounding = -1                       # -1 = perfect circle
    border_size = 6
    border_color = $outer_color
    position = 0, 40
    halign = center
    valign = center
}

auth {
    fingerprint {
        enabled = false
    }
}