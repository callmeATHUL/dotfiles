# FIREFLY Theme Lock Screen Configuration

$color = #0d1117
$inner_color = #0d1117
$outer_color = #ffb300
$font_color = #e8eaed
$check_color = #ffd93d

# FIREFLY branding label at top
label {
    monitor =
    text = FIREFLY
    color = rgba(255, 179, 0, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 300
    halign = center
    valign = center
}

# Subtitle label
label {
    monitor =
    text = Security System
    color = rgba(232, 234, 237, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

# Time label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(255, 211, 61, 0.9)
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, -200
    halign = center
    valign = center
}

# Date label
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d %Y")"
    color = rgba(232, 234, 237, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -270
    halign = center
    valign = center
}
