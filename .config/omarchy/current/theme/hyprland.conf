# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor = rgb(3771ff)

general {
    col.active_border = $activeBorderColor
}

group {
    col.border_active = $activeBorderColor
}

# Tock todo widget — autostart + always visible
exec-once = /home/firefly/.local/bin/tock-widget-start
windowrulev2 = float, class:(tock-widget)
windowrulev2 = pin, class:(tock-widget)
windowrulev2 = stayontop, class:(tock-widget)
